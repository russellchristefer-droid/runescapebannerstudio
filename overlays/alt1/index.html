<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Banner Studio · Alt1</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header>
      <h1>Banner Studio</h1>
      <p>Alt1 sidecar. Not the website. Not a bot.</p>
    </header>
    <p id="status">Drop a still you own, or capture if Alt1 is attached.</p>
    <canvas id="plate" width="1200" height="480" aria-label="Banner plate"></canvas>
    <div class="row">
      <label class="chip">
        Upload still
        <input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden />
      </label>
      <button type="button" class="chip" id="capture">Capture client</button>
      <button type="button" class="chip" id="twitch">1200×480</button>
      <button type="button" class="chip" id="yt">1280×720</button>
    </div>
    <label>
      Name
      <input id="name" maxlength="12" autocomplete="off" />
    </label>
    <button type="button" class="save" id="save">Download JPEG</button>
    <p class="fine">Does not click. Does not read chat. Official rules win.</p>
    <script src="app.js"></script>
  </body>
</html>
