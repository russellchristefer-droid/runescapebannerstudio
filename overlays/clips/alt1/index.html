<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clip bench · Alt1</title>
    <script>
      (function () {
        var href = document.location.href;
        var base = "./";
        if (/githubusercontent/.test(href)) {
          base = "https://cdn.jsdelivr.net/gh/russellchristefer-droid/runescapebannerstudio@main/overlays/clips/alt1/";
        }
        var css = document.createElement("link");
        css.rel = "stylesheet";
        css.href = base + "app.css";
        document.head.appendChild(css);
        window.__alt1AssetBase = base;
      })();
    </script>
  </head>
  <body>
    <header>
      <h1>Clip bench</h1>
      <p>Local clips. Not a live studio. Not a bot.</p>
    </header>
    <p id="status">Drop a clip you own, or upload one.</p>
    <video id="vid" playsinline controls></video>
    <canvas id="stage" width="1280" height="720" hidden></canvas>
    <input id="file" type="file" accept="video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov,video/*" hidden />
    <div class="row">
      <button type="button" class="chip" id="upload">Upload clip</button>
      <button type="button" class="chip" id="play">Play</button>
      <button type="button" class="chip" id="pause">Pause</button>
      <button type="button" class="chip" id="markIn">In</button>
      <button type="button" class="chip" id="markOut">Out</button>
    </div>
    <p id="span">In 0.00 · Out 0.00</p>
    <p class="fine">Crops (preview)</p>
    <div class="row" id="crops">
      <button type="button" class="chip on" data-crop="16:9-720">720p 16:9</button>
      <button type="button" class="chip" data-crop="16:9-1080">1080p 16:9</button>
      <button type="button" class="chip" data-crop="9:16">9:16</button>
      <button type="button" class="chip" data-crop="1:1">1:1</button>
      <button type="button" class="chip" data-crop="banner">Banner</button>
      <button type="button" class="chip" data-crop="native">Native</button>
    </div>
    <p class="fine">Download that crop</p>
    <div class="row" id="downloads">
      <button type="button" class="chip save-size" data-dl="16:9-720">Download 1280×720</button>
      <button type="button" class="chip save-size" data-dl="16:9-1080">Download 1920×1080</button>
      <button type="button" class="chip save-size" data-dl="9:16">Download 1080×1920</button>
      <button type="button" class="chip save-size" data-dl="1:1">Download 1080×1080</button>
      <button type="button" class="chip save-size" data-dl="banner">Download 1200×480</button>
      <button type="button" class="chip save-size" data-dl="native">Download native</button>
    </div>
    <p class="fine">
      Don't export a Bank PIN. Credit: Alt1 Toolkit by skillbert / runeapps.org.
      Add app:
      <a href="alt1://addapp/https://raw.githubusercontent.com/russellchristefer-droid/runescapebannerstudio/main/overlays/clips/alt1/appconfig.json">alt1://addapp</a>
    </p>
    <script>
      (function () {
        var s = document.createElement("script");
        s.src = (window.__alt1AssetBase || "./") + "app.js";
        document.body.appendChild(s);
      })();
    </script>
  </body>
</html>
