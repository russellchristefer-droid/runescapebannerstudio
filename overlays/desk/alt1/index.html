<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Still compositor · Alt1</title>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <header>
      <h1>Still compositor</h1>
      <p>Alt1 sidecar. Not the website. Not a bot.</p>
    </header>
    <p id="status">Drop a still you own, or capture if Alt1 is attached.</p>
    <canvas id="plate" width="1200" height="480" aria-label="Banner plate"></canvas>
    <div class="row">
      <label class="chip">Upload still<input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden /></label>
      <button type="button" class="chip" id="capture">Capture client</button>
      <button type="button" class="chip" id="twitch">1200×480</button>
      <button type="button" class="chip" id="yt">1280×720</button>
    </div>
    <label>Name<input id="name" maxlength="12" autocomplete="off" /></label>
    <button type="button" class="save" id="save">Download JPEG</button>
    <p class="fine">
      Credit: Alt1 Toolkit by skillbert / runeapps.org. RuneScape® and Old School RuneScape® are Jagex Limited trademarks.
      Add app:
      <a href="alt1://addapp/https://raw.githubusercontent.com/russellchristefer-droid/runescapebannerstudio/main/overlays/desk/alt1/appconfig.json">alt1://addapp</a>
    </p>
    <script src="./app.js"></script>
  </body>
</html>
